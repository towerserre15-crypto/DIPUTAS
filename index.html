<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Trivia</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .trivia-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 520px;
      padding: 30px;
      text-align: center;
      position: relative;
    }

    .progreso-container {
      width: 100%;
      background-color: #e2e8f0;
      border-radius: 8px;
      height: 8px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .barra-progreso {
      height: 100%;
      width: 0%;
      background: #667eea;
      transition: width 0.3s ease;
    }

    .pregunta-numero {
      font-size: 14px;
      color: #718096;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .pregunta-texto {
      font-size: 20px;
      color: #2d3748;
      font-weight: 700;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .opciones {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .opcion-btn {
      background-color: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 600;
      color: #4a5568;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .opcion-btn:hover:not(:disabled) {
      border-color: #667eea;
      background-color: #edf2f7;
      transform: translateY(-2px);
    }

    .opcion-btn.correcta {
      background-color: #c6f6d5 !important;
      border-color: #38a169 !important;
      color: #22543d !important;
    }

    .opcion-btn.incorrecta {
      background-color: #fed7d7 !important;
      border-color: #e53e3e !important;
      color: #742a2a !important;
    }

    .siguiente-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      width: 100%;
      transition: background 0.2s;
    }

    .siguiente-btn:hover {
      background: #5a67d8;
    }

    .resultado-final {
      display: none;
    }

    .resultado-final h2 {
      color: #2d3748;
      font-size: 24px;
      margin-bottom: 12px;
    }

    .puntaje-grande {
      font-size: 48px;
      font-weight: 800;
      color: #667eea;
      margin: 15px 0;
    }

    .reiniciar-btn {
      background: #48bb78;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }

    .reiniciar-btn:hover {
      background: #38a169;
    }
  </style>
</head>
<body>

  <div class="trivia-card">
    <div class="progreso-container" id="contenedor-progreso">
      <div class="barra-progreso" id="barra"></div>
    </div>

    <div id="pantalla-juego">
      <div class="pregunta-numero" id="contador-pregunta">Pregunta 1</div>
      <div class="pregunta-texto" id="texto-pregunta">Cargando...</div>
      
      <div class="opciones" id="contenedor-opciones"></div>

      <button class="siguiente-btn" id="btn-siguiente" onclick="siguientePregunta()">Siguiente Pregunta</button>
    </div>

    <div class="resultado-final" id="pantalla-resultado">
      <h2>¡Juego Terminado!</h2>
      <p>Tu puntuación final es:</p>
      <div class="puntaje-grande" id="puntaje-final">0 / 0</div>
      <p id="mensaje-calificacion"></p>
      <button class="reiniciar-btn" onclick="iniciarJuego()">Volver a Jugar</button>
    </div>
  </div>

  <script>
    const misPreguntas = [
      {
        pregunta: "¿Quien fue el primer beso de Lichet?",
        opciones: ["Bri", "Oli", "Manuel", "Lea"],
        correcta: 3 // Lea
      },
      {
        pregunta: "¿Quien desvirgochis a Lichet?",
        opciones: ["Lea", "Daniela", "Andy", "Diego"],
        correcta: 2 // Andy
      },
      {
        pregunta: "¿Quien fue protagonista del famoso vomito en la lavadora?",
        opciones: ["Dan", "Lea", "Gus", "Lichet"],
        correcta: 3 // Lichet
      },
      {
        pregunta: "¿Quien es la zoofilica del grupo?",
        opciones: ["Arturo", "Angel", "Lea", "Snay"],
        correcta: 1 // Angel
      },
      {
        pregunta: "Famosa influencer ex integrante de las diputadas y sapa de las capturas",
        opciones: ["Lea", "La sany", "Diego", "Lichet"],
        correcta: 1 // La sany
      },
      {
        pregunta: "¿Quien se cago cuando se la metieron?",
        opciones: ["Lea", "Bri", "Diego", "Arturo"],
        correcta: 3 // Arturo
      },
      {
        pregunta: "Diputada infiel",
        opciones: ["Arturo", "Lichet", "Bri", "Oli"],
        correcta: [0, 1, 2, 3] // Cualquiera es correcta
      },
      {
        pregunta: "Responsable directo del pan con pollo asqueroso de la navidad pasada",
        opciones: ["Dan", "Lea", "Diego", "Oli"],
        correcta: 1 // Lea
      },
      {
        pregunta: "Diputada que usa la T de cobre",
        opciones: ["Oli", "Bri", "Diego", "Dan"],
        correcta: 0 // Oli
      },
      {
        pregunta: "Diputada que fue negada por Manuel",
        opciones: ["Diego", "Bri", "Lea", "Dan"],
        correcta: 2 // Lea
      },
      {
        pregunta: "LA MAS MUSTIA DEL GRUPO",
        opciones: ["Lea", "Bri", "Dan", "Oli"],
        correcta: 0 // Lea
      },
      {
        pregunta: "LEA HUELE A",
        opciones: ["Flores", "Crotolamo"],
        correcta: 1 // Crotolamo
      }
    ];

    let indiceActual = 0;
    let puntuacion = 0;

    const textoPregunta = document.getElementById("texto-pregunta");
    const contenedorOpciones = document.getElementById("contenedor-opciones");
    const contadorPregunta = document.getElementById("contador-pregunta");
    const btnSiguiente = document.getElementById("btn-siguiente");
    const barra = document.getElementById("barra");
    const pantallaJuego = document.getElementById("pantalla-juego");
    const pantallaResultado = document.getElementById("pantalla-resultado");
    const contenedorProgreso = document.getElementById("contenedor-progreso");
    const puntajeFinal = document.getElementById("puntaje-final");
    const mensajeCalificacion = document.getElementById("mensaje-calificacion");

    function iniciarJuego() {
      indiceActual = 0;
      puntuacion = 0;
      pantallaResultado.style.display = "none";
      contenedorProgreso.style.display = "block";
      pantallaJuego.style.display = "block";
      mostrarPregunta();
    }

    function mostrarPregunta() {
      btnSiguiente.style.display = "none";
      contenedorOpciones.innerHTML = "";

      const pActual = misPreguntas[indiceActual];
      contadorPregunta.textContent = `Pregunta ${indiceActual + 1} de ${misPreguntas.length}`;
      textoPregunta.textContent = pActual.pregunta;

      const porcentaje = ((indiceActual) / misPreguntas.length) * 100;
      barra.style.width = porcentaje + "%";

      pActual.opciones.forEach((opcion, index) => {
        const boton = document.createElement("button");
        boton.textContent = opcion;
        boton.classList.add("opcion-btn");
        boton.onclick = () => verificarRespuesta(index, boton);
        contenedorOpciones.appendChild(boton);
      });
    }

    function verificarRespuesta(indiceElegido, botonElegido) {
      const pActual = misPreguntas[indiceActual];
      const botones = contenedorOpciones.querySelectorAll(".opcion-btn");

      botones.forEach(btn => btn.disabled = true);

      const esCorrecta = Array.isArray(pActual.correcta) 
        ? pActual.correcta.includes(indiceElegido)
        : indiceElegido === pActual.correcta;

      if (esCorrecta) {
        botonElegido.classList.add("correcta");
        puntuacion++;
      } else {
        botonElegido.classList.add("incorrecta");
        if (Array.isArray(pActual.correcta)) {
          pActual.correcta.forEach(idx => botones[idx].classList.add("correcta"));
        } else {
          botones[pActual.correcta].classList.add("correcta");
        }
      }

      btnSiguiente.style.display = "block";
    }

    function siguientePregunta() {
      indiceActual++;
      if (indiceActual < misPreguntas.length) {
        mostrarPregunta();
      } else {
        mostrarResultados();
      }
    }

    function mostrarResultados() {
      barra.style.width = "100%";
      pantallaJuego.style.display = "none";
      contenedorProgreso.style.display = "none";
      pantallaResultado.style.display = "block";

      puntajeFinal.textContent = `${puntuacion} / ${misPreguntas.length}`;

      if (puntuacion === misPreguntas.length) {
        mensajeCalificacion.textContent = "¡Perfecto! Eres una verdadera diputada.";
      } else if (puntuacion >= misPreguntas.length / 2) {
        mensajeCalificacion.textContent = "¡Casi maldita perra!.";
      } else {
        mensajeCalificacion.textContent = "Que imbecil.";
      }
    }

    iniciarJuego();
  </script>
</body>
</html>
